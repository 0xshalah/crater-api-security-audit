name: Security Tests & Regression CI

on:
  push:
    branches:
      - main
      - 'fix/*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  security-audit:
    name: Crater REST API Security & Regression Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Audit Repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Test Harness Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymysql requests pytest

      - name: Clone Pinned Crater Invoicing Target
        run: |
          git clone https://github.com/crater-invoice-inc/crater.git target-crater
          cd target-crater
          git checkout 05d5ce26fdd8d9466009163444e944259bc0cc2a

      - name: Configure Docker & Port Mapping for Target
        run: |
          cd target-crater
          # Map port 8000:80 for Nginx web access
          sed -i 's/- 80:80/- 8000:80\n      - 80:80/' docker-compose.yml
          
          # Setup .env file
          cp .env.example .env
          sed -i 's|APP_URL=.*|APP_URL=http://127.0.0.1:8000|' .env
          sed -i 's/DB_HOST=.*/DB_HOST=db/' .env
          sed -i 's/DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=crater/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=crater/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=crater/' .env

      - name: Install Research Fixture Seeder
        run: |
          cp seeder/SecurityResearchSeeder.php target-crater/database/seeders/

      - name: Apply Security Remediation Patch
        run: |
          cd target-crater
          git apply ../patches/remediation.diff

      - name: Start Crater Docker Environment
        run: |
          cd target-crater
          docker compose up -d --build

      - name: Poll MariaDB Readiness
        run: |
          cd target-crater
          echo "[*] Menunggu kesiapan MariaDB pada port TCP 33006..."
          for i in {1..40}; do
            if docker compose exec -T db mariadb -u crater -pcrater -e "SELECT VERSION();" >/dev/null 2>&1 || \
               docker compose exec -T db mysql -u crater -pcrater -e "SELECT VERSION();" >/dev/null 2>&1; then
              echo "[+] MariaDB is healthy and ready for connections!"
              break
            fi
            echo "Waiting for MariaDB... ($i/40)"
            sleep 2
          done

      - name: Initialize Target Application & Database
        run: |
          cd target-crater
          docker compose exec -T app composer install --no-interaction --prefer-dist
          docker compose exec -T app php artisan key:generate
          docker compose exec -T app php artisan migrate:fresh --seed --seeder=SecurityResearchSeeder

      - name: Collect Environment Manifest
        run: |
          cd target-crater
          CRATER_DIR=$(pwd) ../manifests/collect_manifest.sh ../manifests/environment_manifest.json

      - name: Execute Security Test Suite (tests_security_runner.py)
        run: |
          python harness/tests_security_runner.py

      - name: Execute Functional Regression Suite (test_functional_regression.py)
        run: |
          python harness/test_functional_regression.py

      - name: Generate Coverage Matrix Reports
        run: |
          python harness/generate_coverage_matrix.py reports/coverage_matrix_post_mitigation.md reports/coverage_matrix_post_mitigation.csv

      - name: Upload Audit Evidence & Reports Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crater-security-audit-artifacts
          path: |
            manifests/environment_manifest.json
            evidence/security_audit_evidence.jsonl
            reports/coverage_matrix*.md
            reports/coverage_matrix*.csv
